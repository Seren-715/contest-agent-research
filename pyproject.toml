[project]
name = "contest-agent"
version = "0.1.0"
description = "2026 CCF 全国高校 Agent 网络创新挑战赛 · 赛题 1「科研助手」参赛 Agent"
requires-python = ">=3.9,<3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "httpx>=0.27,<0.28",
    "pydantic>=2.7,<2.12",
    "pypdf>=5,<6",
    "python-multipart>=0.0.9,<0.1",
    "python-dotenv>=1,<2",
    "openai>=1.35,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "fpdf2>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "core", "handlers", "d_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
